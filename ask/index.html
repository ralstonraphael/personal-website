<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ask about Ralston's work</title>
  <meta name="description" content="Ask a question about Ralston Raphael's work. Answers come only from a profile he reviewed." />
  <meta name="theme-color" content="#f6f5f1" />
  <meta name="color-scheme" content="light dark" />
  <!-- Deployed API URL goes in content (empty until deploy). ?api=… overrides it for local testing. -->
  <meta name="ask-api" content="" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="../assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // saved theme, same key as the homepage
    try {
      if (localStorage.getItem('rr:theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#0c0c0b';
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../assets/css/site.css" />
  <link rel="stylesheet" href="ask.css" />
  <script type="module" src="ask.js"></script>
</head>
<body>
  <main class="ask" id="main">
    <a class="ask-back mono" href="../">&larr; ralston.raphael</a>
    <h1>Ask about Ralston's work</h1>
    <p class="ask-note">Answers come only from a profile Ralston reviewed. If it isn't in there, it says so.</p>

    <form class="ask-form" id="ask-form" novalidate>
      <label for="question">Your question</label>
      <textarea id="question" name="question" rows="3" maxlength="500" placeholder="Has he built anything with RAG?"></textarea>
      <div class="ask-row">
        <span class="ask-count mono" id="count" aria-hidden="true">0 / 500</span>
        <button type="submit" class="ask-btn" id="ask-btn">Ask</button>
      </div>
    </form>

    <div class="ask-answer" id="answer" aria-live="polite"></div>
  </main>

  <footer class="ask-foot mono">
    <a href="mailto:ralstone2005@gmail.com">ralstone2005@gmail.com</a>
    <a href="../">back to the homepage</a>
  </footer>
</body>
</html>
